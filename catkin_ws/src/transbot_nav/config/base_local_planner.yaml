DWAPlannerROS:
  # Robot velocity limits (conservative for Transbot tank drive)
  max_vel_x: 0.2
  min_vel_x: -0.1
  max_vel_y: 0.0       # non-holonomic, no lateral movement
  min_vel_y: 0.0
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0

  # Goal tolerances
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: false

  # Forward simulation
  sim_time: 2.0
  sim_granularity: 0.05
  vx_samples: 10
  vy_samples: 1         # only 1 since no lateral motion
  vtheta_samples: 20

  # Trajectory scoring
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05

  # Oscillation prevention
  oscillation_reset_dist: 0.05
