# Local costmap — rolling window for reactive obstacle avoidance

local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 3.0
  static_map: false
  rolling_window: true
  width: 3.2
  height: 3.2
  resolution: 0.05

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # Override the shared inflation settings locally so the rover can pass
  # closer to obstacles without the local planner treating the whole aisle as blocked.
  inflation_layer:
    inflation_radius: 0.18
    cost_scaling_factor: 6.0
